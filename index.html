<!-- MODAL MULTIMEDIA DINÁMICO (Soporta Vídeos Locales MP4, YouTube, Audio o Fotos) -->
<div id="mediaModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md p-4 hidden opacity-0 transition-opacity duration-300">
    <div class="relative w-full max-w-2xl rounded-2xl bg-[#111827] border border-slate-700 p-6 shadow-2xl">
        <div class="flex items-center justify-between mb-4">
            <h3 id="modalTitle" class="font-serif text-xl font-bold text-white">Reproductor Sincronizado</h3>
            <button onclick="closeMediaModal()" class="rounded-lg p-2 text-slate-400 hover:bg-slate-800 hover:text-white transition-colors">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>
        <!-- Contenedor dinámico de multimedia -->
        <div id="modalContentContainer" class="aspect-video w-full overflow-hidden rounded-xl bg-slate-950 mb-4 shadow-inner relative flex items-center justify-center">
            <!-- Se inyecta iframe, video local o imagen según el tipo -->
        </div>
        <div class="flex items-center justify-between text-xs text-slate-400" id="audio-control-bar">
            <span id="audio-status-label"><i class="fa-solid fa-volume-xmark text-amber-400 mr-1"></i> Audio silenciado (invitado).</span>
            <button id="toggle-audio-btn" onclick="toggleAudio()" class="rounded bg-slate-800 px-3 py-1 text-slate-200 hover:bg-slate-700 transition-colors">
                Activar Audio (Modo Sala)
            </button>
        </div>
    </div>
</div>

<script>
    const modal = document.getElementById('mediaModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalContentContainer = document.getElementById('modalContentContainer');
    const audioControlBar = document.getElementById('audio-control-bar');
    let isAudioMuted = true;
    let activeCasoId = '';

    window.openSyncedMedia = function(casoId) {
        activeCasoId = casoId;
        const caso = window.casosConfig[casoId];
        if (!caso) return;

        modalTitle.textContent = caso.titulo;
        isAudioMuted = true;
        renderModalContent();
        
        modal.classList.remove('hidden');
        setTimeout(() => modal.classList.remove('opacity-0'), 10);
    }

    function renderModalContent() {
        const caso = window.casosConfig[activeCasoId];
        if (!caso) return;

        let startSecond = 0;
        if (window.casoTimestamps && window.casoTimestamps[activeCasoId]) {
            const elapsedMs = Date.now() - window.casoTimestamps[activeCasoId];
            startSecond = Math.max(0, Math.floor(elapsedMs / 1000));
        }

        if (caso.tipo === 'video') {
            audioControlBar.style.display = 'flex';
            
            // Comprobamos si es un vídeo local (termina en .mp4 o contiene assets/) o de YouTube
            if (caso.recursoId.includes('assets/') || caso.recursoId.endsWith('.mp4')) {
                const mutedAttr = isAudioMuted ? 'muted' : '';
                modalContentContainer.innerHTML = `
                    <video id="localVideoPlayer" autoplay ${mutedAttr} controls class="h-full w-full object-contain">
                        <source src="${caso.recursoId}" type="video/mp4">
                        Tu navegador no soporta vídeos HTML5.
                    </video>
                `;
                // Sincronizar el segundo exacto para vídeo local
                const videoEl = document.getElementById('localVideoPlayer');
                if (videoEl) {
                    videoEl.currentTime = startSecond;
                }
            } else {
                // Es un vídeo de YouTube
                const muteParam = isAudioMuted ? 1 : 0;
                modalContentContainer.innerHTML = `<iframe class="h-full w-full border-0" src="https://www.youtube.com/embed/${caso.recursoId}?autoplay=1&mute=${muteParam}&start=${startSecond}" allow="autoplay"></iframe>`;
            }
            updateAudioLabel();
        } else if (caso.tipo === 'audio') {
            audioControlBar.style.display = 'flex';
            const mutedAttr = isAudioMuted ? 'muted' : '';
            modalContentContainer.innerHTML = `
                <div class="flex flex-col items-center justify-center p-6 text-center">
                    <i class="fa-solid fa-music text-amber-400 text-5xl mb-4 animate-bounce"></i>
                    <p class="text-white font-serif text-lg mb-4">${caso.titulo}</p>
                    <audio autoplay ${mutedAttr} controls src="${caso.recursoId}" class="w-full"></audio>
                </div>
            `;
            updateAudioLabel();
        } else {
            // Tipo Foto
            audioControlBar.style.display = 'none';
            modalContentContainer.innerHTML = `<img src="${caso.recursoId}" alt="Foto Inédita" class="h-full w-full object-contain" onerror="this.src='https://images.unsplash.com/photo-1523821741446-edb2b68bb7a0?auto=format&fit=crop&w=800&q=80'">`;
        }
    }

    function updateAudioLabel() {
        const label = document.getElementById('audio-status-label');
        const btn = document.getElementById('toggle-audio-btn');
        if (isAudioMuted) {
            label.innerHTML = '<i class="fa-solid fa-volume-xmark text-amber-400 mr-1"></i> Audio silenciado (invitado).';
            btn.textContent = 'Activar Audio (Modo Sala)';
        } else {
            label.innerHTML = '<i class="fa-solid fa-volume-high text-emerald-400 mr-1"></i> Audio ACTIVADO (Altavoz principal).';
            btn.textContent = 'Silenciar Audio';
        }
    }

    window.toggleAudio = function() {
        isAudioMuted = !isAudioMuted;
        renderModalContent();
    }

    window.closeMediaModal = function() {
        modal.classList.add('opacity-0');
        setTimeout(() => {
            modal.classList.add('hidden');
            modalContentContainer.innerHTML = '';
        }, 300);
    }
</script>
